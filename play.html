<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>jClassicRPG — Play</title>
<style>
	html, body {
		margin: 0;
		height: 100%;
		overflow: hidden;
		background: #10131a;
		font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		color: #e6e6e6;
		touch-action: none;
		overscroll-behavior: none;
		-webkit-user-select: none;
		user-select: none;
		-webkit-touch-callout: none;
	}
	#scene-canvas {
		position: fixed;
		inset: 0;
		width: 100%;
		height: 100%;
		display: block;
		cursor: grab;
		touch-action: none;
	}
	#load-status {
		position: fixed;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		color: #cfd6e0;
		font-size: 0.95rem;
		z-index: 10;
	}
	.hud {
		position: fixed;
		z-index: 5;
		pointer-events: none;
	}
	#hud-topbar {
		top: 0; left: 0; right: 0;
		display: flex;
		gap: 1px;
		background: linear-gradient(#5a3a20, #3a2412);
		border-bottom: 2px solid #1c1208;
		font-size: clamp(0.6rem, 2.4vw, 0.8rem);
		padding-top: env(safe-area-inset-top);
		overflow-x: auto;
		pointer-events: auto;
	}
	#hud-topbar span, #hud-topbar button, #hud-topbar label {
		padding: 0.5rem clamp(0.4rem, 2vw, 1rem);
		color: #e8d9b8;
		white-space: nowrap;
	}
	#hud-portrait-card {
		top: calc(2.6rem + env(safe-area-inset-top));
		left: calc(0.4rem + env(safe-area-inset-left));
		display: flex;
		flex-direction: column;
		align-items: center;
		background: rgba(20, 16, 8, 0.55);
		border: 2px solid #a8894f;
		border-radius: 4px;
		padding: 0.3rem;
		width: clamp(56px, 18vw, 90px);
	}
	#hud-portrait {
		width: 100%;
		aspect-ratio: 1;
		object-fit: cover;
		border: 1px solid #6b5326;
		background: #333;
	}
	#hud-name {
		color: #f2e6b8;
		font-size: clamp(0.6rem, 2vw, 0.8rem);
		margin-top: 0.2rem;
		text-transform: uppercase;
		text-align: center;
	}
	#hud-profession {
		color: #7fb0ff;
		font-size: clamp(0.55rem, 1.8vw, 0.75rem);
	}
	#hud-log {
		bottom: calc(0.5rem + env(safe-area-inset-bottom));
		left: calc(0.4rem + env(safe-area-inset-left));
		width: clamp(160px, 48vw, 320px);
		max-height: clamp(80px, 20vh, 130px);
		overflow: hidden;
		background: rgba(230, 210, 160, 0.9);
		color: #2a2010;
		font-family: Georgia, "Times New Roman", serif;
		font-size: clamp(0.62rem, 2.2vw, 0.78rem);
		line-height: 1.25;
		padding: 0.4rem 0.6rem;
		border: 2px solid #8a6a3a;
		border-radius: 3px;
	}
	#hud-minimap {
		bottom: calc(0.5rem + env(safe-area-inset-bottom));
		right: calc(0.4rem + env(safe-area-inset-right));
		width: clamp(96px, 22vw, 144px);
		padding: 0;
		background: #17251b;
		border: 2px solid #b39050;
		border-radius: 5px;
		pointer-events: auto;
		cursor: pointer;
		color: #fff0cf;
	}
	#minimap-canvas { display: block; width: 100%; aspect-ratio: 1; }
	#hud-minimap span { display: block; padding: 3px; font-size: 0.65rem; }
	#hud-topbar button { background: transparent; border: 0; font: inherit; cursor: pointer; }
	button:focus-visible, input:focus-visible { outline: 2px solid #ffdc89; outline-offset: 2px; }
	#world-map-dialog {
		box-sizing: border-box;
		width: min(1100px, calc(100vw - 24px));
		height: min(900px, calc(100dvh - 24px));
		max-width: none; max-height: none;
		padding: 1rem;
		background: #17201f; color: #eee5cd;
		border: 2px solid #967545; border-radius: 9px;
		touch-action: pan-y;
	}
	#world-map-dialog[open] { display: flex; flex-direction: column; gap: 0.7rem; }
	#world-map-dialog::backdrop { background: #000b; }
	.map-heading { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
	.map-heading h2 { margin: 0; font-size: 1.25rem; }
	#map-close { padding: 0.6rem 1rem; color: inherit; background: #343c35; border: 1px solid #967545; border-radius: 5px; cursor: pointer; }
	#map-filters { display: flex; flex-wrap: wrap; gap: 0.35rem 0.8rem; font-size: 0.8rem; }
	#map-filters label { display: flex; align-items: center; gap: 0.2rem; cursor: pointer; }
	.map-notes { margin: 0; font-size: 0.75rem; line-height: 1.4; color: #bdc8bf; }
	.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 1rem; min-height: 0; flex: 1; }
	.map-visual { min-width: 0; overflow: auto; }
	.map-frame { max-width: min(100%, calc(100dvh - 245px)); margin: auto; }
	#world-map-canvas { display: block; width: 100%; aspect-ratio: 1; cursor: pointer; border: 1px solid #71816b; box-sizing: border-box; }
	#map-detail { margin: 0.5rem 0; font-size: 0.8rem; line-height: 1.4; min-height: 2.8em; }
	.map-sidebar { display: flex; flex-direction: column; min-height: 0; gap: 0.5rem; }
	#map-search { box-sizing: border-box; width: 100%; padding: 0.65rem; background: #0f1717; color: #eee5cd; border: 1px solid #71816b; font: inherit; border-radius: 4px; }
	#map-location-count { font-size: 0.75rem; }
	#map-locations { overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
	#map-locations button { display: block; width: 100%; margin-bottom: 0.4rem; padding: 0.6rem; text-align: left; background: #26342e; color: inherit; border: 1px solid #49604d; border-radius: 4px; cursor: pointer; font: inherit; font-size: 0.8rem; line-height: 1.5; }
	@media (max-width: 700px) {
		.map-layout { display: block; overflow-y: auto; }
		.map-frame { max-width: 100%; }
		.map-visual { overflow: visible; }
		.map-sidebar { margin-top: 0.8rem; height: 260px; }
		#world-map-dialog { padding: 0.7rem; }
	}
	#hud-location {
		top: calc(4.8rem + env(safe-area-inset-top));
		right: calc(0.4rem + env(safe-area-inset-right));
		padding: 0.3rem 0.5rem;
		background: rgba(20, 16, 8, 0.65);
		color: #eee4c9;
		font-size: 0.75rem;
	}
	#hud-nav {
		top: calc(2.6rem + env(safe-area-inset-top));
		right: calc(0.4rem + env(safe-area-inset-right));
		pointer-events: auto;
		font-size: clamp(0.6rem, 2vw, 0.75rem);
	}
	#hud-nav a {
		color: #bcd7ff;
		background: rgba(20, 16, 8, 0.55);
		border: 1px solid #4a5a6f;
		border-radius: 4px;
		padding: 0.3rem 0.5rem;
		text-decoration: none;
		margin-left: 0.3rem;
		display: inline-block;
	}
	/* Movement/look split-screen hint — only shown briefly on small touch screens, purely visual. */
	#hud-hint {
		top: 50%; left: 0; right: 0;
		transform: translateY(-50%);
		display: none;
		justify-content: space-between;
		padding: 0 1rem;
		color: rgba(255,255,255,0.35);
		font-size: 0.75rem;
		text-transform: uppercase;
		letter-spacing: 0.05em;
	}
	@media (hover: none) and (pointer: coarse) {
		#hud-hint { display: flex; }
	}
	@media (max-width: 430px) {
		#hud-portrait-card { width: 52px; }
		#hud-log { max-height: 96px; }
	}
</style>
</head>
<body>
<canvas id="scene-canvas"></canvas>
<div id="load-status">Loading scene…</div>

<div id="hud-topbar" class="hud">
	<span>Menu</span><button id="map-open" type="button" aria-haspopup="dialog">Map</button><button id="world-interact" type="button">Explore · WASD / drag</button><button id="world-save" type="button">Export save</button><label style="cursor:pointer">Import save<input id="world-import" type="file" accept="application/json" hidden></label><button id="world-retry" type="button">Retry loading</button>
</div>
<div id="hud-portrait-card" class="hud">
	<img id="hud-portrait" alt="Active character portrait">
	<div id="hud-name">—</div>
	<div id="hud-profession">—</div>
</div>
<div id="hud-log" class="hud"></div>
<div id="hud-location" class="hud" aria-live="off"></div>
<button id="hud-minimap" class="hud" type="button" aria-label="Open world map" aria-haspopup="dialog" title="Nearby map: 116-unit radius, twice the visible area">
	<canvas id="minimap-canvas" width="256" height="256" aria-hidden="true"></canvas>
	<span>Map · 116-unit radius</span>
</button>
<div id="hud-nav" class="hud">
	<a href="index.html">Summary</a><a href="sim.html">Sim</a>
</div>
<div id="hud-hint" class="hud"><span>◐ move</span><span>look ◑</span></div>

<dialog id="world-map-dialog" aria-labelledby="map-title">
	<div class="map-heading"><h2 id="map-title">World map · N ↑</h2><button id="map-close" type="button" autofocus>Close</button></div>
	<div id="map-filters" role="group" aria-label="Visible marker types"></div>
	<p class="map-notes">Red arrow: you. Dashed markers: unimplemented locations, still available for surface teleport. Nearby map: twice the visible radius; white ring: visible area.</p>
	<p id="map-mission-note" class="map-notes"></p>
	<div class="map-layout">
		<div class="map-visual"><div class="map-frame"><canvas id="world-map-canvas" width="800" height="800" role="img" aria-label="Saved world terrain and locations. Use the location list to teleport with a keyboard."></canvas></div><p id="map-detail">Tap a marker to teleport, or tap the map background to close.</p></div>
		<div class="map-sidebar"><label for="map-search">Find a location</label><input id="map-search" type="search" placeholder="Name, type or coordinates" autocomplete="off"><div id="map-location-count"></div><div id="map-locations" aria-label="Teleport destinations"></div></div>
	</div>
</dialog>

<!-- Frozen saved-world exploration; terrain and shared model assets stream through a fixed pool. -->
<script type="module" src="jCRPG-engine/js/play_page.js"></script>
</body>
</html>
