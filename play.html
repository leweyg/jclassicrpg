<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>jClassicRPG — Play</title>
<style>
	html, body {
		margin: 0;
		height: 100%;
		overflow: hidden;
		background: #10131a;
		font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		color: #e6e6e6;
		touch-action: none;
		overscroll-behavior: none;
		-webkit-user-select: none;
		user-select: none;
		-webkit-touch-callout: none;
	}
	#scene-canvas {
		position: fixed;
		inset: 0;
		width: 100%;
		height: 100%;
		display: block;
		cursor: grab;
		touch-action: none;
	}
	#load-status {
		position: fixed;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		color: #cfd6e0;
		font-size: 0.95rem;
		z-index: 10;
	}
	.hud {
		position: fixed;
		z-index: 5;
		pointer-events: none;
	}
	#hud-topbar {
		top: 0; left: 0; right: 0;
		display: flex;
		gap: 1px;
		background: linear-gradient(#5a3a20, #3a2412);
		border-bottom: 2px solid #1c1208;
		font-size: clamp(0.6rem, 2.4vw, 0.8rem);
		padding-top: env(safe-area-inset-top);
		overflow-x: auto;
		pointer-events: auto;
	}
	#hud-topbar span {
		padding: 0.5rem clamp(0.4rem, 2vw, 1rem);
		color: #e8d9b8;
		white-space: nowrap;
	}
	#hud-portrait-card {
		top: calc(2.6rem + env(safe-area-inset-top));
		left: calc(0.4rem + env(safe-area-inset-left));
		display: flex;
		flex-direction: column;
		align-items: center;
		background: rgba(20, 16, 8, 0.55);
		border: 2px solid #a8894f;
		border-radius: 4px;
		padding: 0.3rem;
		width: clamp(56px, 18vw, 90px);
	}
	#hud-portrait {
		width: 100%;
		aspect-ratio: 1;
		object-fit: cover;
		border: 1px solid #6b5326;
		background: #333;
	}
	#hud-name {
		color: #f2e6b8;
		font-size: clamp(0.6rem, 2vw, 0.8rem);
		margin-top: 0.2rem;
		text-transform: uppercase;
		text-align: center;
	}
	#hud-profession {
		color: #7fb0ff;
		font-size: clamp(0.55rem, 1.8vw, 0.75rem);
	}
	#hud-log {
		bottom: calc(0.5rem + env(safe-area-inset-bottom));
		left: calc(0.4rem + env(safe-area-inset-left));
		width: clamp(160px, 48vw, 320px);
		max-height: clamp(80px, 20vh, 130px);
		overflow: hidden;
		background: rgba(230, 210, 160, 0.9);
		color: #2a2010;
		font-family: Georgia, "Times New Roman", serif;
		font-size: clamp(0.62rem, 2.2vw, 0.78rem);
		line-height: 1.25;
		padding: 0.4rem 0.6rem;
		border: 2px solid #8a6a3a;
		border-radius: 3px;
	}
	#hud-minimap {
		bottom: calc(0.5rem + env(safe-area-inset-bottom));
		right: calc(0.4rem + env(safe-area-inset-right));
		width: clamp(64px, 20vw, 110px);
		height: clamp(64px, 20vw, 110px);
		background: #000;
		border: 2px solid #8a6a3a;
		border-radius: 3px;
	}
	#hud-minimap::after {
		content: "";
		position: absolute;
		top: 50%; left: 50%;
		width: 6px; height: 6px;
		background: #d33;
		border-radius: 50%;
		transform: translate(-50%, -50%);
	}
	#hud-nav {
		top: calc(2.6rem + env(safe-area-inset-top));
		right: calc(0.4rem + env(safe-area-inset-right));
		pointer-events: auto;
		font-size: clamp(0.6rem, 2vw, 0.75rem);
	}
	#hud-nav a {
		color: #bcd7ff;
		background: rgba(20, 16, 8, 0.55);
		border: 1px solid #4a5a6f;
		border-radius: 4px;
		padding: 0.3rem 0.5rem;
		text-decoration: none;
		margin-left: 0.3rem;
		display: inline-block;
	}
	/* Movement/look split-screen hint — only shown briefly on small touch screens, purely visual. */
	#hud-hint {
		top: 50%; left: 0; right: 0;
		transform: translateY(-50%);
		display: none;
		justify-content: space-between;
		padding: 0 1rem;
		color: rgba(255,255,255,0.35);
		font-size: 0.75rem;
		text-transform: uppercase;
		letter-spacing: 0.05em;
	}
	@media (hover: none) and (pointer: coarse) {
		#hud-hint { display: flex; }
	}
	@media (max-width: 430px) {
		#hud-portrait-card { width: 52px; }
		#hud-log { max-height: 96px; }
	}
</style>
</head>
<body>
<canvas id="scene-canvas"></canvas>
<div id="load-status">Loading scene…</div>

<div id="hud-topbar" class="hud">
	<span>Menu</span><span>Map</span><span>Camp</span><span>Order</span><span>Behvr.</span><span>Action</span><span>Search</span>
</div>
<div id="hud-portrait-card" class="hud">
	<img id="hud-portrait" alt="Active character portrait">
	<div id="hud-name">—</div>
	<div id="hud-profession">—</div>
</div>
<div id="hud-log" class="hud"></div>
<div id="hud-minimap" class="hud"></div>
<div id="hud-nav" class="hud">
	<a href="index.html">Summary</a><a href="sim.html">Sim</a>
</div>
<div id="hud-hint" class="hud"><span>◐ move</span><span>look ◑</span></div>

<!-- First rendering pass: real media/models geometry via a minimal OBJ loader, shared GameState for party/HUD data. -->
<script type="module" src="jCRPG-engine/js/play_page.js"></script>
</body>
</html>
