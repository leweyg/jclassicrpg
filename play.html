<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jClassicRPG — Play</title>
<style>
	html, body {
		margin: 0;
		height: 100%;
		overflow: hidden;
		background: #10131a;
		font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		color: #e6e6e6;
	}
	#scene-canvas {
		position: fixed;
		inset: 0;
		width: 100%;
		height: 100%;
		display: block;
		cursor: grab;
	}
	#load-status {
		position: fixed;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		color: #cfd6e0;
		font-size: 0.95rem;
		z-index: 10;
	}
	.hud {
		position: fixed;
		z-index: 5;
		pointer-events: none;
	}
	#hud-topbar {
		top: 0; left: 0; right: 0;
		display: flex;
		gap: 1px;
		background: linear-gradient(#5a3a20, #3a2412);
		border-bottom: 2px solid #1c1208;
		font-size: 0.8rem;
	}
	#hud-topbar span {
		padding: 0.5rem 1rem;
		color: #e8d9b8;
	}
	#hud-portrait-card {
		top: 2.4rem; left: 0.6rem;
		display: flex;
		flex-direction: column;
		align-items: center;
		background: rgba(20, 16, 8, 0.55);
		border: 2px solid #a8894f;
		border-radius: 4px;
		padding: 0.3rem;
		width: 90px;
	}
	#hud-portrait {
		width: 80px;
		height: 80px;
		object-fit: cover;
		border: 1px solid #6b5326;
		background: #333;
	}
	#hud-name {
		color: #f2e6b8;
		font-size: 0.8rem;
		margin-top: 0.2rem;
		text-transform: uppercase;
	}
	#hud-profession {
		color: #7fb0ff;
		font-size: 0.75rem;
	}
	#hud-log {
		bottom: 0.6rem; left: 0.6rem;
		width: 320px;
		max-height: 130px;
		overflow: hidden;
		background: rgba(230, 210, 160, 0.9);
		color: #2a2010;
		font-family: Georgia, "Times New Roman", serif;
		font-size: 0.78rem;
		line-height: 1.25;
		padding: 0.5rem 0.7rem;
		border: 2px solid #8a6a3a;
		border-radius: 3px;
	}
	#hud-minimap {
		bottom: 0.6rem; right: 0.6rem;
		width: 110px;
		height: 110px;
		background: #000;
		border: 2px solid #8a6a3a;
		border-radius: 3px;
	}
	#hud-minimap::after {
		content: "";
		position: absolute;
		top: 50%; left: 50%;
		width: 6px; height: 6px;
		background: #d33;
		border-radius: 50%;
		transform: translate(-50%, -50%);
	}
	#hud-nav {
		top: 2.4rem; right: 0.6rem;
		pointer-events: auto;
		font-size: 0.75rem;
	}
	#hud-nav a {
		color: #bcd7ff;
		background: rgba(20, 16, 8, 0.55);
		border: 1px solid #4a5a6f;
		border-radius: 4px;
		padding: 0.3rem 0.6rem;
		text-decoration: none;
		margin-left: 0.3rem;
	}
</style>
</head>
<body>
<canvas id="scene-canvas"></canvas>
<div id="load-status">Loading scene…</div>

<div id="hud-topbar" class="hud">
	<span>Menu</span><span>Map</span><span>Camp</span><span>Order</span><span>Behvr.</span><span>Action</span><span>Search</span>
</div>
<div id="hud-portrait-card" class="hud">
	<img id="hud-portrait" alt="Active character portrait">
	<div id="hud-name">—</div>
	<div id="hud-profession">—</div>
</div>
<div id="hud-log" class="hud"></div>
<div id="hud-minimap" class="hud"></div>
<div id="hud-nav" class="hud">
	<a href="index.html">Summary</a><a href="sim.html">Sim</a>
</div>

<!-- First rendering pass: real media/models geometry via a minimal OBJ loader, shared GameState for party/HUD data. -->
<script type="module" src="jCRPG-engine/js/play_page.js"></script>
</body>
</html>
